<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>干支大全 デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#f3ead8; --sumi:#2b2620; --shu:#c73e2c; --kin:#b8912f;
    --matsu:#4a6741; --mizu:#4a6fa5; --kage:#d9cdb4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--sumi);
    font-family:"Zen Maru Gothic",sans-serif;color:var(--sumi);
    display:flex;justify-content:center;align-items:flex-start;
    touch-action:manipulation;
  }
  #app{
    width:100%;max-width:900px;background:var(--washi);
    background-image:radial-gradient(ellipse at 20% 10%, rgba(184,145,47,.08), transparent 50%),
                     radial-gradient(ellipse at 85% 90%, rgba(199,62,44,.05), transparent 45%);
    border-left:12px solid var(--shu);border-right:12px solid var(--shu);
    box-shadow:0 0 40px rgba(0,0,0,.6);user-select:none;
  }
  header{display:flex;align-items:center;gap:12px;padding:10px 14px 2px;}
  .hanko{
    font-family:"Yuji Syuku",serif;background:var(--shu);color:var(--washi);
    width:48px;height:48px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1.05;text-align:center;
    transform:rotate(-3deg);box-shadow:1px 1px 0 rgba(0,0,0,.25);flex:none;
  }
  h1{font-family:"Yuji Syuku",serif;font-size:clamp(19px,4vw,27px);letter-spacing:.14em;font-weight:400;}
  h1 small{font-size:.48em;color:var(--kin);letter-spacing:.18em;margin-left:8px;}
  .stageline{
    padding:0 14px 4px;font-size:12px;font-weight:700;color:#7a5c10;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .stageline .snum{font-family:"Yuji Syuku",serif;color:var(--shu);font-size:15px;}
  .stSel{padding:3px 9px !important;font-size:11px !important;}
  .tokiline{
    display:flex;align-items:center;gap:8px;
    padding:2px 14px 6px;font-size:12px;font-weight:700;
  }
  .tokiline .tk{
    background:var(--sumi);color:var(--washi);
    border-radius:6px;padding:2px 10px;font-family:"Yuji Syuku",serif;letter-spacing:.1em;
  }
  .tokiline .tkbar{flex:1;height:6px;background:var(--kage);border-radius:3px;overflow:hidden;}
  .tokiline .tkbar i{display:block;height:100%;background:var(--kin);}
  .hpbars{display:flex;justify-content:space-between;gap:14px;padding:2px 14px 8px;font-size:11px;font-weight:700;}
  .hpwrap{flex:1;}
  .hpwrap .label{display:flex;justify-content:space-between;margin-bottom:2px;}
  .bar{height:10px;background:var(--kage);border-radius:5px;overflow:hidden;border:1px solid rgba(43,38,32,.25);}
  .bar i{display:block;height:100%;border-radius:5px;transition:width .2s;}
  .bar.ally i{background:var(--matsu);}
  .bar.foe i{background:var(--shu);}
  #cvWrap{position:relative;}
  #cv{display:block;width:100%;}
  #banner{
    position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;
    font-family:"Yuji Syuku",serif;font-size:clamp(22px,5vw,34px);
    letter-spacing:.25em;color:var(--shu);
    text-shadow:0 0 12px rgba(243,234,216,.95);
    opacity:0;transition:opacity .3s;
  }
  #renkei{
    position:absolute;left:0;right:0;top:22%;
    text-align:center;pointer-events:none;opacity:0;
  }
  #renkei.on{animation:stampIn 1.4s ease-out forwards;}
  @keyframes stampIn{
    0%{opacity:0;transform:scale(2.2) rotate(-10deg);}
    12%{opacity:1;transform:scale(1) rotate(-4deg);}
    22%{transform:scale(1.08) rotate(-4deg);}
    30%{transform:scale(1) rotate(-4deg);}
    78%{opacity:1;}
    100%{opacity:0;transform:scale(1) rotate(-4deg) translateY(-8px);}
  }
  #renkei .pair{
    display:inline-block;
    font-family:"Yuji Syuku",serif;
    font-size:clamp(30px,7vw,52px);letter-spacing:.1em;
    color:var(--washi);
    background:var(--shu);
    border:3px solid rgba(43,38,32,.5);
    border-radius:10px;
    padding:2px 18px 6px;
    box-shadow:3px 3px 0 rgba(43,38,32,.4), 0 0 26px rgba(199,62,44,.45);
  }
  #renkei .cnt{
    display:block;margin-top:4px;
    font-family:"Yuji Syuku",serif;
    font-size:clamp(15px,3.4vw,22px);letter-spacing:.3em;
    color:var(--kin);
    text-shadow:0 0 10px rgba(243,234,216,.95), 1px 1px 0 rgba(43,38,32,.4);
  }
  .chainline{
    display:flex;align-items:center;gap:8px;
    padding:5px 14px 0;font-size:11.5px;font-weight:700;color:#7a6f5c;
  }
  .chainline .nz{
    font-family:"Yuji Syuku",serif;font-size:15px;color:var(--mizu);
    background:#fbf6ea;border:2px solid var(--mizu);border-radius:8px;
    padding:0 9px 2px;
  }
  .chainline .ch{color:var(--kin);font-family:"Yuji Syuku",serif;letter-spacing:.15em;}
  .hud{display:flex;align-items:center;gap:10px;padding:8px 14px 4px;flex-wrap:wrap;}
  .kaki{font-weight:700;font-size:17px;min-width:112px;}
  .kaki small{display:block;font-size:10px;font-weight:500;color:#7a6f5c;}
  button{
    font-family:inherit;font-weight:700;
    border:2px solid var(--sumi);border-radius:10px;
    background:var(--washi);color:var(--sumi);
    padding:8px 12px;font-size:13px;cursor:pointer;
    box-shadow:2px 2px 0 var(--sumi);
  }
  button:active{transform:translate(2px,2px);box-shadow:none;}
  button:disabled{opacity:.4;box-shadow:none;transform:none;cursor:default;}
  #upBtn{border-color:var(--kin);box-shadow:2px 2px 0 var(--kin);color:#7a5c10;}
  #speedBtn{margin-left:auto;}
  .deck{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:8px 14px 6px;}
  .card{
    position:relative;overflow:hidden;
    border:2px solid var(--sumi);border-radius:12px;
    background:#fbf6ea;box-shadow:2px 2px 0 var(--sumi);
    padding:5px 2px 4px;cursor:pointer;text-align:center;
    transition:border-color .2s;
  }
  .card:active{transform:translate(2px,2px);box-shadow:none;}
  .card .csvg{width:clamp(30px,7vw,46px);height:auto;display:block;margin:0 auto;}
  .card .nm{font-size:clamp(9px,1.9vw,11.5px);font-weight:700;display:block;}
  .card .rl{font-size:clamp(8px,1.6vw,10px);color:#8a7f6a;display:block;}
  .card .cost{font-size:clamp(9px,1.8vw,11px);color:var(--shu);font-weight:700;}
  .card .trine{position:absolute;top:4px;left:4px;width:8px;height:8px;border-radius:50%;}
  .card .cd{position:absolute;inset:0;background:rgba(43,38,32,.55);transform-origin:bottom;pointer-events:none;}
  .card.poor{filter:grayscale(.7);opacity:.65;}
  .card.toki{border-color:var(--kin);box-shadow:0 0 8px rgba(184,145,47,.7),2px 2px 0 var(--kin);}
  .card.next{border-color:var(--mizu);}
  .legend{
    padding:0 14px 12px;font-size:10px;color:#8a7f6a;
    display:flex;gap:12px;flex-wrap:wrap;letter-spacing:.03em;
  }
  .legend b{color:var(--sumi);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px;}
  #overlay{
    position:fixed;inset:0;background:rgba(43,38,32,.78);
    display:none;align-items:center;justify-content:center;z-index:10;
  }
  #overlay .paper{
    background:var(--washi);border:6px double var(--shu);
    border-radius:8px;padding:28px 38px;text-align:center;max-width:86%;
  }
  #overlay h2{font-family:"Yuji Syuku",serif;font-size:33px;letter-spacing:.15em;margin-bottom:8px;}
  #overlay p{font-size:13px;margin-bottom:18px;color:#5c5346;white-space:pre-line;line-height:1.7;}
  footer{text-align:center;font-size:10px;color:#8a7f6a;padding:0 14px 10px;letter-spacing:.05em;line-height:1.6;}
  @media (max-width:520px){
    header{padding:8px 10px 2px;}
    .deck{gap:5px;padding:8px 10px 6px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hanko">干支<br>大全</div>
    <h1>干支大全<small>― 十三番目の椅子 ―</small></h1>
  </header>

  <div class="stageline">
    <span class="snum">第<span id="stNum">一</span>幕</span>
    <span id="stName"></span>
    <span style="margin-left:auto;display:flex;gap:5px;">
      <button class="stSel" data-st="0">一</button>
      <button class="stSel" data-st="1">二</button>
      <button class="stSel" data-st="2">三</button>
    </span>
  </div>

  <div class="tokiline">
    <span class="tk" id="tokiName">子の刻</span>
    <span id="tokiEmoji">🐭</span><span style="color:#7a5c10;">の刻 ─ 対応する干支が奮起(攻1.5倍)</span>
    <span class="tkbar"><i id="tokiBar" style="width:0%"></i></span>
  </div>

  <div class="hpbars">
    <div class="hpwrap">
      <div class="label"><span>⛩️ 十二支の社</span><span id="allyHpTxt"></span></div>
      <div class="bar ally"><i id="allyHp" style="width:100%"></i></div>
    </div>
    <div class="hpwrap">
      <div class="label"><span id="foeHpTxt"></span><span id="foeName">化け猫の砦 🏯</span></div>
      <div class="bar foe"><i id="foeHp" style="width:100%"></i></div>
    </div>
  </div>

  <div id="cvWrap">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="renkei"><span class="pair" id="rkPair"></span><span class="cnt" id="rkCnt"></span></div>
  </div>

  <div class="chainline">
    <span>連携の輪:次は</span><span class="nz" id="nextZi">子</span>
    <span id="chainMsg">十二支の順(子→丑→…)で召喚すると連携!</span>
    <span class="ch" id="chainCnt" style="margin-left:auto;"></span>
  </div>

  <div class="hud">
    <div class="kaki"><span style="color:var(--kin);font-family:'Yuji Syuku',serif;">氣</span> <span id="money">0</span> / <span id="moneyMax">750</span><small>気(自動で満ちる)</small></div>
    <button id="upBtn">気脈Lv<span id="wLv">1</span>up 氣<span id="upCost">80</span></button>
    <button id="sndBtn">🔊</button>
    <button id="speedBtn">⏩ x1</button>
  </div>

  <div class="deck" id="deck"></div>

  <div class="legend">
    <span><b>順番連携</b>:十二支の順(子→丑→…)で召喚すると連携バフ(青枠=次の干支)</span>
    <span><b>三合</b>:<span class="dot" style="background:#4a6fa5"></span>水局 <span class="dot" style="background:#b8912f"></span>金局 <span class="dot" style="background:#c73e2c"></span>火局 <span class="dot" style="background:#4a6741"></span>木局 ─ 同じ局が2体以上で全員攻撃強化</span>
    <span><b>刻</b>:金枠の干支は今が見せ場</span>
  </div>

  <footer>十二支に入れなかった化け猫たちが「十三番目の椅子」を求めて攻め寄せる。<br>昔ばなし「十二支のはじまり」より ─ 個人開発プロトタイプ(仮題・商標確認前)</footer>
</div>

<div id="overlay">
  <div class="paper">
    <h2 id="ovTitle">勝利</h2>
    <p id="ovMsg"></p>
    <button id="nextBtn">次の幕へ</button>
    <button id="retryBtn">この幕をやり直す</button>
  </div>
</div>

/* ===== src/core.js ===== */
/* ============================================================
   干支合戦絵巻 - core.js
   純粋ゲームロジック層。DOM・Canvas・Audioへの依存ゼロ。
   演出が必要な出来事は events 配列に積み、外側(render/ui)が消費する。
   Node(シミュレータ)とブラウザで同一コードが動く = Single Source of Truth。
   ============================================================ */
(function(exp){
"use strict";

function createGame(opts){
  const D = opts.data;
  const C = D.CONST;
  const rng = opts.rng || Math.random;
  const stageIdx = opts.stage || 0;
  const st = D.STAGES[stageIdx];

  const g = {
    stageIdx, st,
    t: 0,
    money: st.startMoney || C.START_MONEY,
    moneyMax: C.MONEY_MAX0,
    wLv: 1,
    upCost: C.UP_COST0,
    allyBaseHp: C.ALLY_BASE_HP,
    foeBaseHp: st.castleHp,
    allies: [], foes: [],
    cds: D.UNITS.map(()=>0),
    spawnTimer: 5,
    bossSpawned: false,
    over: false, won: false,
    lastZi: -99, chain: 0,
    prevToki: -1,
    events: [],
  };

  function emit(e){ g.events.push(e); }

  /* ---------- バフ計算 ---------- */
  g.tokiIdx = function(){ return Math.floor(g.t / C.TOKI_LEN) % 12; };

  g.trineActive = function(){
    const cnt=[0,0,0,0];
    for(const a of g.allies) cnt[a.zi%4]++;
    return cnt.map(c=>c>=2);
  };

  function atkOf(e){
    if(e.side!=="ally") return e.atk;
    let m = e.comboMult || 1;
    if(g.trineActive()[e.zi%4]) m *= C.TRINE_MUL;
    if(e.zi === g.tokiIdx()) m *= C.TOKI_ATK_MUL;
    return Math.round(e.atk * m);
  }
  function spdOf(e){
    if(e.side==="ally" && e.zi===g.tokiIdx()) return e.spd * C.TOKI_SPD_MUL;
    return e.spd;
  }

  /* ---------- エンティティ ---------- */
  function makeUnit(def, side, comboMult){
    const dir = side==="ally" ? 1 : -1;
    return Object.assign({}, def, {
      side, dir,
      x: side==="ally" ? C.ALLY_BASE_X+22 : C.FOE_BASE_X-22,
      maxHp: def.hp, hp: def.hp,
      atkTimer: 0, atkAnim: 0,
      wob: rng()*Math.PI*2,
      yOff: (rng()*14)-7,
      kbStep: def.hp/def.kb, kbCount: 0, kbT: 0,
      comboMult: comboMult||1,
    });
  }

  function damage(o, amt){
    o.hp -= amt;
    emit({type:"damage", x:o.x, y:C.GROUND-o.size*2-14+o.yOff, amt, side:o.side});
    const stepIdx = Math.floor((o.maxHp-o.hp)/o.kbStep);
    if(stepIdx > o.kbCount && o.hp > 0){
      o.kbCount = stepIdx;
      o.kbT = C.KB_TIME;
    }
  }

  function targetOf(e){
    const opp = e.side==="ally" ? g.foes : g.allies;
    let best=null, bd=1e9;
    for(const o of opp){
      const d = e.dir>0 ? o.x-e.x : e.x-o.x;
      if(d>=-10 && d<bd){bd=d;best=o;}
    }
    const baseX = e.side==="ally" ? C.FOE_BASE_X : C.ALLY_BASE_X;
    const dBase = e.dir>0 ? baseX-e.x : e.x-baseX;
    if(dBase<bd){bd=dBase;best="base";}
    return {best,dist:bd};
  }

  /* ---------- プレイヤー操作 ---------- */
  g.summon = function(i){
    const u = D.UNITS[i];
    if(g.over || g.cds[i]>0 || g.money<u.cost) return false;
    g.money -= u.cost;
    g.cds[i] = u.cd;
    let mult = 1, comboed = false, prevZi = g.lastZi;
    if(u.zi === (g.lastZi+1)%12 && g.lastZi >= 0){
      g.chain++;
      mult = C.COMBO_BASE + C.COMBO_PER_CHAIN * Math.min(g.chain, C.COMBO_CHAIN_CAP);
      comboed = true;
    }else{
      g.chain = 0;
    }
    g.lastZi = u.zi;
    g.allies.push(makeUnit(u, "ally", mult));
    emit({type:"summon", x:C.ALLY_BASE_X+22, y:C.GROUND-14,
          combo:comboed, chain:g.chain, prevZi, zi:u.zi});
    return true;
  };

  g.upgrade = function(){
    if(g.over || g.money < g.upCost) return false;
    g.money -= g.upCost;
    g.wLv++;
    g.moneyMax += C.MONEY_CAP_UP;
    g.upCost = Math.floor(g.upCost * C.UP_COST_MUL);
    emit({type:"upgrade", lv:g.wLv});
    return true;
  };

  /* ---------- 進行 ---------- */
  function end(win){
    g.over = true; g.won = win;
    emit({type:"end", win});
  }

  g.step = function(dt){
    if(g.over) return;
    g.t += dt;

    // 刻の切り替わり
    const tk = g.tokiIdx();
    if(tk !== g.prevToki){
      if(g.prevToki >= 0) emit({type:"toki", idx:tk});
      g.prevToki = tk;
    }

    // 気の収入・クールダウン
    g.money = Math.min(g.moneyMax, g.money + (C.INCOME_BASE + C.INCOME_PER_LV*g.wLv)*dt);
    for(let i=0;i<g.cds.length;i++) g.cds[i]=Math.max(0,g.cds[i]-dt);

    // 敵スポーン
    g.spawnTimer -= dt;
    if(g.spawnTimer <= 0){
      const pool = st.pool(g.t);
      const key = pool[Math.floor(rng()*pool.length)];
      g.foes.push(makeUnit(D.CATS[key], "foe"));
      g.spawnTimer = st.pace(g.t) * (g.bossSpawned ? C.BOSS_PACE_MUL : 1);
    }
    // ボス出現
    if(!g.bossSpawned && g.foeBaseHp < st.castleHp*st.bossAt){
      g.foes.push(makeUnit(D.CATS[st.bossKey], "foe"));
      if(st.escort) g.foes.push(makeUnit(D.CATS[st.escort], "foe"));
      g.bossSpawned = true;
      emit({type:"boss", name:D.CATS[st.bossKey].name, hint:st.bossHint||""});
    }

    // 戦闘
    for(const arr of [g.allies, g.foes]){
      for(const e of arr){
        e.wob += dt*8;
        e.atkTimer = Math.max(0, e.atkTimer-dt);
        e.atkAnim = Math.max(0, e.atkAnim-dt);
        if(e.kbT > 0){
          e.kbT -= dt;
          e.x -= e.dir * C.KB_SPEED * dt;
          const min = e.side==="ally" ? C.ALLY_BASE_X+10 : C.ALLY_BASE_X;
          const max = e.side==="ally" ? C.FOE_BASE_X : C.FOE_BASE_X-10;
          e.x = Math.max(min, Math.min(max, e.x));
          continue;
        }
        const {best, dist} = targetOf(e);
        if(dist <= e.range){
          if(e.atkTimer === 0){
            e.atkTimer = e.atkInt || 1.0;
            e.atkAnim = 0.22;
            const power = atkOf(e);
            if(best === "base"){
              if(e.side==="ally") g.foeBaseHp -= power; else g.allyBaseHp -= power;
            }else if(e.area){
              const opp = e.side==="ally" ? g.foes : g.allies;
              for(const o of opp){
                const d = e.dir>0 ? o.x-e.x : e.x-o.x;
                if(d>=-10 && d<=e.range+14) damage(o, power);
              }
            }else{
              damage(best, power);
            }
          }
        }else{
          e.x += e.dir * spdOf(e) * dt;
        }
      }
    }

    // 撃破・掃除
    g.foes = g.foes.filter(f=>{
      if(f.hp<=0){
        g.money = Math.min(g.moneyMax, g.money+f.bounty);
        emit({type:"kill", x:f.x, size:f.size, bounty:f.bounty});
        return false;
      }
      return true;
    });
    g.allies = g.allies.filter(a=>a.hp>0);

    if(g.foeBaseHp<=0) end(true);
    else if(g.allyBaseHp<=0) end(false);
  };

  return g;
}

  if(AC.state==="suspended") AC.resume();

function tone(freq,dur,type,vol,delay){
  if(!sndOn) return;

  }catch(e){}
}

"use strict";

function createRenderer(canvas, data, assets){
  const C = data.CONST;

      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90">${assets.CHARS[k]}</svg>`);

  function burst(x,y,color,n,pow){
    for(let i=0;i<(n||8);i++){

      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:0.5+Math.random()*0.3,color,r:2+Math.random()*2.5});
    }
  }

  /* coreイベント→エフェクト変換 */
  function onEvent(ev, g){
    switch(ev.type){
      case "summon":
        if(ev.combo){
          burst(ev.x, ev.y, "#b8912f", 16, 120);
          rings.push({x:ev.x,y:ev.y,r:6,max:60+10*Math.min(ev.chain,4),t:0.55,color:"#b8912f"});
          rings.push({x:ev.x,y:ev.y,r:2,max:40,t:0.4,color:"#c73e2c"});
          pops.push({x:ev.x,y:ev.y-34,txt:data.ZODIAC[ev.prevZi]+"→"+data.ZODIAC[ev.zi],t:1.1,kanji:true});
          shakeT=Math.max(shakeT,0.12+0.03*Math.min(ev.chain,4));
        }else{
          burst(ev.x, ev.y, "#d9cdb4", 6, 55);
        }
        break;
      case "damage":
        pops.push({x:ev.x,y:ev.y,txt:ev.amt,t:0.7,foe:ev.side==="foe"});
        break;
      case "kill":
        pops.push({x:ev.x,y:C.GROUND-ev.size*2-24,txt:"+"+ev.bounty+"氣",t:0.9,gold:true});
        burst(ev.x, C.GROUND-ev.size-8, "#c73e2c", 6, 60);

      case "boss":
        shakeT=0.7;

      case "toki":
        tokiFlash=0.8;

    }

  function update(dt, g){

    pops=pops.filter(p=>{p.t-=dt;p.y-=22*dt;return p.t>0;});

    for(const a of g.allies){

        parts.push({x:a.x+(Math.random()*20-10),y:C.GROUND-14-Math.random()*a.size*2,vx:0,vy:-30,t:0.5,color:"#b8912f",r:1.6});

  function drawKasumi(x,y,w){
    ctx.fillStyle="rgba(184,145,47,.14)";
    ctx.beginPath();
    ctx.ellipse(x,y,w,14,0,0,Math.PI*2);
    ctx.ellipse(x+w*0.7,y+8,w*0.7,11,0,0,Math.PI*2);
    ctx.ellipse(x-w*0.6,y+6,w*0.5,9,0,0,Math.PI*2);

  function drawChar(e, g){

    const y=C.GROUND-8+e.yOff;
    const trines=g.trineActive(), tk=g.tokiIdx();

      ctx.strokeStyle=data.TRINE_COLORS[e.zi%4];

    ctx.fillRect(e.x-w/2,y-e.size*2-6,w,4);

    ctx.save();

      ctx.translate((Math.random()-0.5)*shakeT*18,(Math.random()-0.5)*shakeT*12);
    }

      ctx.fillStyle=`rgba(184,145,47,${tokiFlash*0.22})`;

    ctx.beginPath();ctx.ellipse(650,C.GROUND-8,220,64,0,Math.PI,0);ctx.fill();
    ctx.fillStyle="rgba(184,145,47,.10)";

    ctx.fillStyle="rgba(43,38,32,.06)";

    }

    ctx.textAlign="center";
    for(const p of pops){
      ctx.globalAlpha=Math.min(1,p.t/0.3);
      if(p.kanji){
        ctx.font="26px 'Yuji Syuku',serif";
        ctx.fillStyle="#c73e2c";

}

}
function showRenkei(prevZ, curZ, ch){
  $("rkPair").textContent=D.ZODIAC[prevZ]+" ➤ "+D.ZODIAC[curZ];
  $("rkCnt").textContent="順番連携 "+["","","二","三","四","五","六","七","八"][Math.min(ch+1,8)]+"連!";
  const rk=$("renkei");
  rk.classList.remove("on");
  void rk.offsetWidth;
  rk.classList.add("on");
}

/* ---------- coreイベントの振り分け ---------- */
function dispatch(ev){
  renderer.onEvent(ev, game);
  switch(ev.type){
    case "summon":
      if(ev.combo){ showRenkei(ev.prevZi, ev.zi, ev.chain); Platform.SFX.combo(ev.chain); }
      else Platform.SFX.summon();
      break;
    case "kill": Platform.SFX.coin(); break;
    case "toki": Platform.SFX.toki(); break;
    case "boss":
      Platform.SFX.boss();
      showBanner("⚠ "+ev.name+" 出撃"+(ev.hint?" ─ "+ev.hint:"")+" ⚠");
      break;
    case "end": onEnd(ev.win); break;
  }
}

/* ---------- ステージ管理 ---------- */
function resetStage(){
  game = Core.createGame({stage, data:D});
  renderer.reset();
  $("overlay").style.display="none";
  $("renkei").classList.remove("on");
  const st=D.STAGES[stage];
  $("stNum").textContent=st.kanji;
  $("stName").textContent=st.name;
  $("foeName").textContent=st.castle;
  showBanner("第"+st.kanji+"幕 開演");
  syncStSel();
  syncHud();
}

function onEnd(win){
  if(win)Platform.SFX.win();else Platform.SFX.lose();
  const st=D.STAGES[stage];
  const final = win && stage===D.STAGES.length-1;
  $("ovTitle").textContent = final?"完全勝利":win?"勝 利":"敗 北";
  $("ovTitle").style.color = win?"#4a6741":"#c73e2c";
  $("ovMsg").textContent = win ? st.winMsg
    : "社は焼け落ちた。化け猫が十三番目の椅子に座る……\n順番連携・三合・刻を使いこなし、再戦せよ。";
  $("nextBtn").style.display = win && !final ? "" : "none";
  $("retryBtn").textContent = final ? "第一幕から再演" : win ? "この幕をもう一度" : "この幕をやり直す";
  if(final){stage=0;}
  $("overlay").style.display="flex";
}

/* ---------- HUD ---------- */
function syncHud(){
  const g=game;
  $("money").textContent=Math.floor(g.money);
  $("moneyMax").textContent=g.moneyMax;
  $("wLv").textContent=g.wLv;
  $("upCost").textContent=g.upCost;
  $("upBtn").disabled = g.money<g.upCost || g.over;
  $("allyHp").style.width=(100*Math.max(0,g.allyBaseHp)/C.ALLY_BASE_HP)+"%";
  $("foeHp").style.width=(100*Math.max(0,g.foeBaseHp)/D.STAGES[stage].castleHp)+"%";
  $("allyHpTxt").textContent=Math.max(0,Math.ceil(g.allyBaseHp));
  $("foeHpTxt").textContent=Math.max(0,Math.ceil(g.foeBaseHp));
  const tk=g.tokiIdx();
  $("tokiName").textContent=D.ZODIAC[tk]+"の刻";
  $("tokiEmoji").textContent=D.ZEMOJI[tk];
  $("tokiBar").style.width=(100*(g.t%C.TOKI_LEN)/C.TOKI_LEN)+"%";
  const nextZi=(g.lastZi+1)%12;
  if(g.lastZi>=0){
    $("nextZi").textContent=D.ZODIAC[nextZi];
    const nu=D.UNITS.find(u=>u.zi===nextZi);
    $("chainMsg").textContent=nu?nu.name+"を出すと連携継続!":"";
    $("chainCnt").textContent=g.chain>0?g.chain+"連鎖中":"";
  }else{
    $("nextZi").textContent="子";
    $("chainMsg").textContent="十二支の順(子→丑→…)で召喚すると連携!";
    $("chainCnt").textContent="";
  }
  D.UNITS.forEach((u,i)=>{
    const card=deckCards[i];
    card.classList.toggle("poor", g.money<u.cost);
    card.classList.toggle("toki", u.zi===tk);
    card.classList.toggle("next", g.lastZi>=0 && u.zi===nextZi && u.zi!==tk);
    card.querySelector(".cd").style.transform=`scaleY(${g.cds[i]/u.cd})`;
  });
}

/* ---------- デッキ構築 ---------- */
const deckEl=$("deck"), deckCards=[];
D.UNITS.forEach((u,i)=>{
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`<span class="trine" style="background:${D.TRINE_COLORS[u.zi%4]}"></span>
    <svg class="csvg" viewBox="0 0 100 90"><use href="#g-${u.svg}"/></svg>
    <span class="nm">${u.name}<span style="font-weight:500;color:#b8912f">・${D.ZODIAC[u.zi]}</span></span>
    <span class="rl">${u.role}</span>
    <span class="cost">氣${u.cost}</span><div class="cd"></div>`;
  c.addEventListener("pointerdown",()=>{
    if(game.summon(i)) syncHud();
  });
  deckEl.appendChild(c); deckCards.push(c);
});

/* ---------- ボタン ---------- */
$("upBtn").addEventListener("pointerdown",()=>{ if(game.upgrade()) syncHud(); });
$("sndBtn").addEventListener("pointerdown",()=>{
  Platform.setSound(!Platform.getSound());
  $("sndBtn").textContent=Platform.getSound()?"🔊":"🔇";
  if(Platform.getSound())Platform.SFX.summon();
});
$("speedBtn").addEventListener("pointerdown",()=>{
  speed = speed===1?2:1;
  $("speedBtn").textContent="⏩ x"+speed;
});
$("retryBtn").addEventListener("pointerdown",resetStage);
$("nextBtn").addEventListener("pointerdown",()=>{
  if(game.won && stage<D.STAGES.length-1){stage++;}
  resetStage();
});
document.querySelectorAll(".stSel").forEach(b=>{
  b.addEventListener("pointerdown",()=>{
    stage=parseInt(b.dataset.st);
    resetStage();
  });
});
function syncStSel(){
  document.querySelectorAll(".stSel").forEach(b=>{
    const on=parseInt(b.dataset.st)===stage;
    b.style.background=on?"var(--shu)":"var(--washi)";
    b.style.color=on?"var(--washi)":"var(--sumi)";
  });
}

/* ---------- ゲームループ ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  const sdt=dt*speed;
  game.step(sdt);
  const evs=game.events.splice(0);
  for(const ev of evs) dispatch(ev);
  renderer.update(sdt, game);
  renderer.draw(game);
  syncHud();
  requestAnimationFrame(loop);
}

resetStage();
requestAnimationFrame(loop);

})();

</script>
</body>
</html>
